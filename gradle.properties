org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -Djavax.net.ssl.trustStoreType=Windows-ROOT
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Avast/antivirus TLS interception breaks Java's default cacerts; use the Windows root store.
systemProp.javax.net.ssl.trustStoreType=Windows-ROOT
# UTP result channel uses gRPC+TLS and fails under local TLS interception ("Failed to receive the UTP test results").
android.experimental.androidTest.useUnifiedTestPlatform=false
